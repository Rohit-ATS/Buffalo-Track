<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="The discovery pipeline with claims flowing through the quote verifier">
  <title>Discovery pipeline — watch a claim earn its place</title>
  <desc>Candidate URLs flow from search through a classifier, a fetcher and a model into the quote verifier, which sends verified claims to the database and rejects the rest.</desc>

  <defs>
    <style>
      .sans   { font-family: "DM Sans", "Segoe UI", system-ui, sans-serif; }
      .serif  { font-family: "DM Serif Display", Georgia, serif; }
      .sketch { font-family: "Caveat", "Bradley Hand", cursive; }
      .cap    { font-size: 10px; fill: #5B6B63; letter-spacing: 1.1px; }
      .name   { font-size: 14.5px; fill: #11201A; }
      .cost   { font-size: 9.5px; }
    </style>

    <!-- the spine every claim travels -->
    <path id="spine" d="M118 150H318M318 150H518M518 150H718M718 150H900"/>
    <path id="toDb"  d="M960 150C1010 150 1030 108 1086 108"/>
    <path id="toBin" d="M960 150C1010 150 1030 210 1086 210"/>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="10" fill="#FDFCF8"/>

  <!-- faint grid -->
  <g stroke="#2D6A4F" stroke-opacity="0.05">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200M0 300H1200"/>
  </g>

  <!-- the spine -->
  <path d="M118 150H900" stroke="#D8D4C6" stroke-width="2.5" fill="none"/>
  <path d="M960 150C1010 150 1030 108 1086 108" stroke="#2D6A4F" stroke-width="2.5" fill="none"/>
  <path d="M960 150C1010 150 1030 210 1086 210" stroke="#B5502F" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>

  <!-- stages -->
  <g class="sans">
    <!-- 1 search -->
    <g>
      <circle cx="118" cy="150" r="27" fill="#F6F5EF" stroke="#2D6A4F" stroke-width="2"/>
      <circle cx="113" cy="146" r="7.5" fill="none" stroke="#2D6A4F" stroke-width="2.2"/>
      <path d="M119 152l7 7" stroke="#2D6A4F" stroke-width="2.2" stroke-linecap="round"/>
      <text class="cap" x="118" y="202" text-anchor="middle">SERP API</text>
      <text class="name" x="118" y="220" text-anchor="middle">discover</text>
      <text class="cost" x="118" y="236" text-anchor="middle" fill="#B5502F">billable</text>
    </g>

    <!-- 2 classifier -->
    <g>
      <rect x="288" y="123" width="60" height="54" rx="8" fill="#FDFCF8" stroke="#11201A" stroke-width="2"/>
      <path d="M305 150h26M318 137v26" stroke="#11201A" stroke-width="2" stroke-linecap="round"/>
      <text class="cap" x="318" y="202" text-anchor="middle">CLASSIFIER</text>
      <text class="name" x="318" y="220" text-anchor="middle">filter</text>
      <text class="cost" x="318" y="236" text-anchor="middle" fill="#2D6A4F">free</text>
    </g>

    <!-- 3 unlocker -->
    <g>
      <rect x="491" y="121" width="54" height="58" rx="6" fill="#F6F5EF" stroke="#2D6A4F" stroke-width="2"/>
      <path d="M503 138h30M503 150h30M503 162h20" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round"/>
      <text class="cap" x="518" y="202" text-anchor="middle">WEB UNLOCKER</text>
      <text class="name" x="518" y="220" text-anchor="middle">fetch page</text>
      <text class="cost" x="518" y="236" text-anchor="middle" fill="#B5502F">billable</text>
    </g>

    <!-- 4 model -->
    <g>
      <rect x="690" y="123" width="56" height="54" rx="14" fill="#F6F5EF" stroke="#2D6A4F" stroke-width="2"/>
      <circle cx="707" cy="145" r="3.4" fill="#2D6A4F"/>
      <circle cx="729" cy="145" r="3.4" fill="#2D6A4F"/>
      <path d="M706 161c7 6 17 6 24 0" stroke="#2D6A4F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text class="cap" x="718" y="202" text-anchor="middle">CLAUDE HAIKU 4.5</text>
      <text class="name" x="718" y="220" text-anchor="middle">read &amp; quote</text>
      <text class="cost" x="718" y="236" text-anchor="middle" fill="#B5502F">billable</text>
    </g>

    <!-- 5 verifier: the gate -->
    <g>
      <rect x="900" y="112" width="60" height="76" rx="30" fill="#11201A"/>
      <path d="M916 150l10 11 19-22" stroke="#FDFCF8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="cap" x="930" y="206" text-anchor="middle" fill="#11201A">VERIFIER</text>
      <text class="name" x="930" y="224" text-anchor="middle">quote in page?</text>
      <text class="cost" x="930" y="240" text-anchor="middle" fill="#2D6A4F">free · the gate</text>
      <circle cx="930" cy="150" r="42" fill="none" stroke="#2D6A4F" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="32;50" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- outcomes -->
    <g>
      <rect x="1086" y="84" width="78" height="48" rx="8" fill="#2D6A4F"/>
      <text class="sans" x="1125" y="105" font-size="11.5" fill="#FDFCF8" text-anchor="middle">evidence</text>
      <text class="sans" x="1125" y="121" font-size="10" fill="#CFE3D7" text-anchor="middle">58</text>
    </g>
    <g>
      <rect x="1086" y="186" width="78" height="48" rx="8" fill="#FDFCF8" stroke="#B5502F" stroke-width="2" stroke-dasharray="6 5"/>
      <text class="sans" x="1125" y="207" font-size="11.5" fill="#B5502F" text-anchor="middle">rejected</text>
      <text class="sans" x="1125" y="223" font-size="10" fill="#5B6B63" text-anchor="middle">23</text>
    </g>
  </g>

  <!-- travelling claims: four green that pass, two rust that get thrown out -->
  <g>
    <circle r="5.5" fill="#2D6A4F">
      <animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#spine"/></animateMotion>
    </circle>
    <circle r="5.5" fill="#2D6A4F">
      <animateMotion dur="4s" repeatCount="indefinite" begin="1.1s"><mpath href="#spine"/></animateMotion>
    </circle>
    <circle r="5.5" fill="#2D6A4F">
      <animateMotion dur="4s" repeatCount="indefinite" begin="2.2s"><mpath href="#spine"/></animateMotion>
    </circle>
    <circle r="5.5" fill="#C8941A">
      <animateMotion dur="4s" repeatCount="indefinite" begin="3.1s"><mpath href="#spine"/></animateMotion>
    </circle>

    <!-- past the gate -->
    <circle r="5.5" fill="#2D6A4F">
      <animateMotion dur="4s" repeatCount="indefinite" begin="4s"><mpath href="#toDb"/></animateMotion>
    </circle>
    <circle r="5.5" fill="#2D6A4F">
      <animateMotion dur="4s" repeatCount="indefinite" begin="5.1s"><mpath href="#toDb"/></animateMotion>
    </circle>
    <circle r="5.5" fill="#B5502F">
      <animateMotion dur="4s" repeatCount="indefinite" begin="6.2s"><mpath href="#toBin"/></animateMotion>
    </circle>
  </g>

  <!-- dropped at the classifier -->
  <g opacity="0.9">
    <circle cx="318" cy="150" r="4.5" fill="#B5502F" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;292" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text class="sketch" x="318" y="314" font-size="16" fill="#B5502F" text-anchor="middle" opacity="0.85">679 skipped, each with a reason</text>
  </g>

  <text class="sketch" x="930" y="300" font-size="19" fill="#2D6A4F" text-anchor="middle">no match, no edge</text>
  <text class="sketch" x="118" y="300" font-size="17" fill="#5B6B63" text-anchor="middle">709 candidate URLs</text>
</svg>
