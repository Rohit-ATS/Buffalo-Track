<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="The atlas colour palette: paper, ink, meadow green, amber and rust">
  <title>Every colour in this README is the app's own</title>
  <desc>Pulled straight from the oklch tokens in frontend/src/styles.css.</desc>
  <defs>
    <style>
      .sans  { font-family: "DM Sans", "Segoe UI", system-ui, sans-serif; }
      .sketch{ font-family: "Caveat", "Bradley Hand", cursive; }
      .lbl   { font-size: 12px; fill: #11201A; font-weight: 600; }
      .hex   { font-size: 10.5px; fill: #5B6B63; font-family: Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="160" rx="10" fill="#FDFCF8"/>

  <g>
    <rect x="40"  y="26" width="168" height="62" rx="7" fill="#FDFCF8" stroke="#D8D4C6"/>
    <rect opacity="0" x="232" y="26" width="168" height="62" rx="7" fill="#F6F5EF"><animate attributeName="y" from="46" to="26" dur=".5s" begin="0.00s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.00s" fill="freeze"/></rect>
    <rect opacity="0" x="424" y="26" width="168" height="62" rx="7" fill="#2D6A4F"><animate attributeName="y" from="46" to="26" dur=".5s" begin="0.12s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.12s" fill="freeze"/></rect>
    <rect opacity="0" x="616" y="26" width="168" height="62" rx="7" fill="#11201A"><animate attributeName="y" from="46" to="26" dur=".5s" begin="0.24s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.24s" fill="freeze"/></rect>
    <rect opacity="0" x="808" y="26" width="168" height="62" rx="7" fill="#C8941A"><animate attributeName="y" from="46" to="26" dur=".5s" begin="0.36s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.36s" fill="freeze"/></rect>
    <rect opacity="0" x="1000" y="26" width="160" height="62" rx="7" fill="#B5502F"><animate attributeName="y" from="46" to="26" dur=".5s" begin="0.48s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.48s" fill="freeze"/></rect>
  </g>

  <g class="sans">
    <text class="lbl" x="40"   y="110">paper</text>      <text class="hex" x="40"   y="128">#FDFCF8</text>
    <text class="lbl" x="232"  y="110">surface</text>    <text class="hex" x="232"  y="128">#F6F5EF</text>
    <text class="lbl" x="424"  y="110">meadow</text>     <text class="hex" x="424"  y="128">#2D6A4F</text>
    <text class="lbl" x="616"  y="110">ink</text>        <text class="hex" x="616"  y="128">#11201A</text>
    <text class="lbl" x="808"  y="110">inferred</text>   <text class="hex" x="808"  y="128">#C8941A</text>
    <text class="lbl" x="1000" y="110">rejected</text>   <text class="hex" x="1000" y="128">#B5502F</text>
  </g>

  <text class="sketch" x="1160" y="18" font-size="17" fill="#2D6A4F" text-anchor="end">straight from styles.css</text>
</svg>
