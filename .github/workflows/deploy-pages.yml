name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install locked frontend dependencies
        run: bun ci
      - name: Build and prerender frontend for Pages
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
          VITE_BACKEND_URL: "https://buffalo-track-api.onrender.com"
          VITE_SUPABASE_URL: "https://jmeramxkgnjbnwmltygc.supabase.co"
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node ./node_modules/vite/bin/vite.js build
      - name: Add Pages fallback and disable Jekyll
        run: |
          cp frontend/.output/public/index.html frontend/.output/public/404.html
          touch frontend/.output/public/.nojekyll
          test -f frontend/.output/public/index.html
          test -f frontend/.output/public/dashboard/index.html
          test -f frontend/.output/public/disease/stxbp1/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload prerendered frontend
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/.output/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
