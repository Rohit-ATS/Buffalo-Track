name: Feature request
description: Suggest an improvement that supports Buffalo-Track users or maintainers.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user or maintainer need before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the expected behavior, scope, and any alternatives you considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Atlas research experience
        - Family space
        - Backend API or data pipeline
        - Supabase schema
        - Deployment / contributor experience
        - Documentation
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, sketches, examples, or implementation notes. Do not include secrets or private data.
